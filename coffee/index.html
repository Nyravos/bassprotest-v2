      {
        "title": "先认识耶加雪菲",
        "text": "耶加雪菲是埃塞俄比亚南部吉迪欧高地一带的知名咖啡产地名，并不意味着一座独立庄园。这里的小农常把采下的果实送往集中处理站，所以产区、村庄和处理站的名称，往往比庄园名更能说明一支豆子的来处。袋上的Heirloom则是埃塞咖啡常用的品种统称，并非一个单一、明确的品种名。",
        "sources": [
          {
            "title": "CoffeeNet Trading：耶加雪菲产区与产地层级",
            "url": "https://coffeenet.et/our-coffees"

            "url": "https://keffacoffee.com/glossary/heirloom"
          }

        "kind": "品种与产地"
      },
      {
        "title": "一个名字背后的故事",
        "text": "耶加雪菲的名气，还曾引出一段关于咖啡价值归属的故事。2004年，埃塞俄比亚发起精品咖啡商标与许可计划，把Yirgacheffe、Sidamo和Harar等名称作为品牌来保护和推广，希望产地声誉带来的收益能更多留在种植者手里。世界知识产权组织记录了这项计划，以及后来与星巴克达成名称许可合作的过程。",
        "sources": [
          {
            "title": "WIPO：The Coffee War — Ethiopia and the Starbucks Story",
            "url": "https://www.wipo.int/en/web/ip-advantage/w/stories/the-coffee-war-ethiopia-and-the-starbucks-story"
          }
        ],
        "kind": "品种与产地"
      },
      {
        "title": "这一袋的风味线索",
        "text": "这款采用日晒处理：咖啡果实整颗干燥后再脱去外层。与清爽的水洗表达相比，日晒耶加雪菲常让人联想到莓果、柑橘与更成熟的水果感。本袋标注的热带水果、草莓干、蜂蜜、榛果和红茶，仍按豆袋本身记录；产区的一般描述不会替代这款豆子的实际风味。",

      {
        "title": "让瑰夏被重新认识的一次分地块",
        "text": "2004年，Peterson家族把庄园不同位置的咖啡分开处理与杯测，高处Jaramillo地块的瑰夏因此显出独特香气，并赢得当年的Best of Panama。让它成名的，不只是品种，也是一种认真区分土地与采收的做法。",
        "sources": [
          {
            "title": "Hacienda La Esmeralda · Our Story",
            "url": "https://haciendaesmeralda.com/our-story/"
          }
        ],
        "kind": "产地故事"
      },
      {
        "title": "从埃塞森林到巴拿马高地",
        "text": "瑰夏的旅程起于1930年代在埃塞俄比亚采集的咖啡种质，经坦桑尼亚研究站，于1953年进入中美洲CATIE，1960年代再传到巴拿马。Geisha和Gesha两种拼写，都能见到。",
        "sources": [
          {
            "title": "World Coffee Research · Geisha 的品种与历史",
            "url": "https://varieties.worldcoffeeresearch.org/varieties/geisha-panama"
          }
        ],
        "kind": "品种小札"
      },
      {
        "title": "这支雄狮，读的是日晒与发酵",
        "text": "本款记录为厌氧晒床干燥日晒。庄园的处理介绍将厌氧发酵与干燥方式分开讲述：前者在封闭环境中进行，后者可以借助架高晒床让空气流通。两者是不同环节；庄园的通用流程，不等于这支3ANB的完整生产配方。",
        "sources": [

        "text": "胡瑞Hure位于西达摩的阿贝果娜Arbegona。MOMOS Coffee的产地介绍记录，Bursa Coffee在胡瑞建立了约海拔2400米的生产点Hure Station，种植和推广74158，并向周围农户提供栽培培训。这为“阿贝果娜·胡瑞”这个名字补上了产区背景；本袋海拔仍保留商家标注的2450米。",

        "title": "马萨瓜拉的山地背景",
        "text": "马萨瓜拉Masaguara位于洪都拉斯因蒂布卡Intibucá。当地小农合作社COAQUIL把自己的咖啡产区描述为Montecillos与Opalaca山脉的高地。这个区域背景能帮助我们把地图上的小点放回山地咖啡的生活里；它不代表本款莫卡庄园就属于该合作社。",
        "sources": [
          {
            "title": "COAQUIL 合作社：Masaguara 产区介绍",
            "url": "https://www.coaquil.coop.hn/"
          }
        ],
        "kind": "品种与产地"
      },
      {
        "title": "从家族农场走来的品种",
        "text": "这款列出了Caturra、Catuai与Pacas。Pacas来自波旁的自然变异，1949年在萨尔瓦多Santa Ana一座Pacas家族农场被发现，1974年由洪都拉斯咖啡研究所引入洪都拉斯。Catuai则由Mundo Novo与Caturra杂交选育而来，小树形便于密植，也成为洪都拉斯重要的栽培品种。",
        "sources": [
          {
            "title": "World Coffee Research：Pacas",
            "url": "https://varieties.worldcoffeeresearch.org/varieties/pacas"
          },
          {
            "title": "World Coffee Research：Catuai",
            "url": "https://varieties.worldcoffeeresearch.org/varieties/catuai"
          }
        ],
        "kind": "品种与产地"
      },
      {
        "title": "“雪莉”是这款的名字",
        "text": "“雪莉”保留的是商品名称，品种仍是上面列出的三种咖啡树。原图标注陈年威士忌酒桶发酵、浅中度烘焙，风味参考包括香草、黑巧克力、奶油、莓果、枫糖和威士忌酒香。具体用了什么酒桶、怎样发酵以及持续多久，现有资料没有说明，暂不补成一个看似完整的工艺故事。",
        "sources": [],
        "kind": "品种与产地"
      }

        "title": "四个品种，跨过两代育种",
        "text": "这张标签上的SL28、SL34、Ruiru 11和Batian，串起了肯尼亚咖啡的育种史。SL28与SL34来自1930年代Scott Agricultural Laboratories的选育，“SL”就是实验室名称的缩写。它们以高海拔下的杯中品质潜力受到重视，也容易受到咖啡病害影响。",

        "title": "从五公顷开始的云雾庄园",
        "text": "Inmaculada 位于哥伦比亚考卡山谷省卡利的 Pichindé 山区。2010 年，Holguín 家族从五公顷土地开始，以农林混作方式种下瑰夏、苏丹汝梅、尖身波旁和 Laurina 等少见品种。今天，庄园仍把不同品种与处理方式的探索作为自己的特色。",

        "title": "瑰夏之外的冠军故事",
        "text": "这座庄园的名声也来自瑰夏以外的咖啡：2015 年 Sasa Sestic 用其苏丹汝梅赢得世界咖啡师大赛，2021 年 Diego Campos 又使用其尖身波旁夺冠。这些是庄园的历史；这支瑰夏的处理法与风味仍以原商品资料中的厌氧日晒、玫瑰花茶、葡萄和水蜜桃为准。",

  return (bean.storySections || []).map(section => `<section class="story-section"><div class="story-kind">${escapeHtml(section.kind || '产地故事')}</div><h3>${escapeHtml(section.title)}</h3><p>${escapeHtml(section.text)}${section.sources.map(ref => {const index=bean.researchSources.findIndex(r=>r.url===ref.url);return `<sup><a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener" title="${escapeHtml(ref.title)}" aria-label="资料来源：${escapeHtml(ref.title)}">[${index+1}]</a></sup>`;}).join('')}</p></section>`).join('');
}
function readingSources(bean) {
  return bean.researchSources?.length ? `<details class="reference-details"><summary>阅读来源 <span>${bean.researchSources.length} 篇 ＋</span></summary><ol>${bean.researchSources.map(ref=>`<li><a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener">${escapeHtml(ref.title)} ↗</a></li>`).join('')}</ol><p>产区、庄园和品种背景与本款批次资料分开记录。</p></details>` : '';
}
function mapCredits(bean) {
  const map=bean.originMap;
  return `<details class="map-credits"><summary>地图说明与来源</summary><p>${escapeHtml(map.note)}${map.hasMarker ? '，圆点为城镇／产区参照点，并非庄园精确坐标。' : '，尚未标注具体产区点。'}各国轮廓分别适配画幅，不代表统一比例。</p><p>国界：<a href="https://www.naturalearthdata.com/downloads/110m-cultural-vectors/110m-admin-0-countries/" target="_blank" rel="noopener">Natural Earth</a>${map.pointSource ? ` · 产区定位：<a href="${escapeHtml(map.pointSource)}" target="_blank" rel="noopener">GeoNames（CC BY 4.0）</a>` : ''}</p></details>`;
}
function card(bean) {
  return `<a class="bean-card" href="?bean=${encodeURIComponent(bean.id)}" aria-label="查看${escapeHtml(bean.titleEn)} / ${escapeHtml(bean.name)}${bean.demo ? '，排版示例' : ''}">${cover(bean)}<div class="card-head"><span>${escapeHtml(bean.country)}</span><span>${escapeHtml(bean.processGroups[0])}</span></div><h3 lang="en">${escapeHtml(bean.titleEn)}</h3><p class="card-cn">${escapeHtml(bean.name)}</p><p class="card-subtitle">${escapeHtml(bean.flavors.join(' · '))}</p><div class="card-bottom"><span>${bean.demo ? '查看示例档案' : escapeHtml(bean.status + ' · ' + bean.recordType)}</span><span class="arrow">↗</span></div></a>`;
}
function start() {
  const beans = [...window.COFFEE_BEANS].sort((a,b) => new Intl.Collator('en', {sensitivity:'base', numeric:true}).compare(a.titleEn,b.titleEn));
  const beanId = new URL(location.href).searchParams.get('bean');
  if (beanId) {
    const bean = beans.find(item => item.id === beanId);
    if (bean) renderDetail(bean);
    else {
      document.title = '未找到这支豆子 · 咖啡豆档案';
      app.innerHTML = '<section class="wrap not-found"><p class="eyebrow">COFFEE ARCHIVE / 404</p><h1>这支豆子，还没入册。</h1><p>可以回到档案馆，看看其他豆子。</p><a href="./#archive" class="button dark">浏览全部豆子 ↗</a></section>';
    }
  } else {
    renderArchive(beans);
    const anchor = document.getElementById(location.hash.slice(1));
    if (anchor) requestAnimationFrame(() => anchor.scrollIntoView({behavior:'instant',block:'start'}));
  }
}
function renderArchive(beans) {
  app.innerHTML = `<div class="wrap" id="top"><section class="hero"><div><div class="eyebrow">A PERSONAL COLLECTION OF COFFEE</div><h1>把喝过的豆子，<br>慢慢收进来。</h1><p>记下每一支豆子的来处，和留在杯里的风味。<br>如果你刚好喝到了一杯，就从这里认识它。</p><div class="hero-note">一本慢慢更新的私人咖啡手记</div></div><div class="hero-art" aria-hidden="true"><div class="art-top"><span>COFFEE ARCHIVE</span><span>FIELD NOTES</span></div><svg viewBox="0 0 220 250"><g fill="none" stroke="currentColor" stroke-width="1"><ellipse cx="110" cy="125" rx="65" ry="90" transform="rotate(28 110 125)"/><path d="M147 46C48 102 169 145 74 205"/><ellipse cx="110" cy="125" rx="88" ry="112" transform="rotate(28 110 125)" stroke-dasharray="1 5"/></g></svg><div class="art-bottom"><span>ORIGIN. PROCESS.<br>FLAVOUR. MEMORIES.</span><b>豆</b></div></div></section><section class="archive" id="archive" aria-labelledby="archive-title"><div class="section-top"><div class="section-heading"><h2 id="archive-title">豆子档案</h2><span class="eyebrow">THE COLLECTION · A–Z</span></div><label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="m12 12 5 5"/></svg><input id="search" type="search" placeholder="找产地、风味、豆子…" aria-label="搜索豆子" autocomplete="off"></label></div><div class="toolbar"><div class="filters" role="group" aria-label="按处理法筛选"><button class="filter active" data-filter="全部" aria-pressed="true">全部</button><button class="filter" data-filter="水洗" aria-pressed="false">水洗</button><button class="filter" data-filter="日晒" aria-pressed="false">日晒</button><button class="filter" data-filter="蜜处理" aria-pressed="false">蜜处理</button><button class="filter" data-filter="特殊处理" aria-pressed="false">特殊处理</button></div><span class="result-count" id="result-count" role="status" aria-live="polite"></span></div>${beans.some(b => b.demo) ? '<p class="demo-note"><span>示例预览</span>以下为版式示例，产地与风味仅用于展示，不代表实际购买的豆子。</p>' : '<div style="height:26px"></div>'}<div class="bean-grid" id="bean-grid"></div></section><section class="about" id="about"><div><span class="eyebrow">A NOTE FROM HERE</span><h2>好喝的，<br>值得留一页。</h2></div><div class="about-text"><div><h3>关于这本档案</h3><p>这里收着买过的豆子，也收着在店里喝到的一杯。先从地图认识来处，再读读庄园与品种的故事。豆袋资料和查证的背景分别整理，想多了解一点时，也能找到原始来源。</p></div><div><h3>从一杯，逛到下一杯</h3><p>杯子上的二维码，会带你找到这支豆子的专属介绍。看完它的故事，也欢迎回到这里，翻翻其他豆子的档案。</p></div></div></section></div>`;
  let filter = '全部';
  const search = document.querySelector('#search');
  function update() {
    const normalize = value => String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
    const query = normalize(search.value.trim());
    const filtered = beans.filter(bean => (filter === '全部' || (bean.processGroups || [bean.process]).includes(filter)) && normalize([bean.titleEn,bean.name,bean.english,bean.country,bean.region,bean.location,bean.variety,bean.process,bean.lot,bean.sourceName,...bean.flavors].join(' ')).includes(query));
    document.querySelector('#bean-grid').innerHTML = filtered.length ? filtered.map(card).join('') : '<div class="empty">暂时没有找到这支豆子。<br>试试其他风味或产地关键词。</div>';
    document.querySelector('#result-count').textContent = `${filtered.length} ${beans.every(b => b.demo) ? '份示例' : '份档案'}`;
  }
  search.addEventListener('input', update);
  document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
    filter = button.dataset.filter;
    document.querySelectorAll('.filter').forEach(item => {item.classList.toggle('active', item === button);item.setAttribute('aria-pressed',String(item === button));});
    update();
  }));
  update();
}

function renderDetail(bean) {
  document.title = `${bean.titleEn} · ${bean.name} · 咖啡豆档案`;
  const facts = [
    ['产地',[bean.country,bean.region].filter(Boolean).join(' · ')],
    ['产区／庄园／处理站',bean.location],
    ['品种',bean.variety],['处理法',bean.process],['海拔',bean.altitude],
    ['烘焙程度',bean.roast],
    ...(bean.lot ? [['批次／商品代码',bean.lot]] : []),
    ...(bean.sourceName ? [['来源标记',bean.sourceName]] : [])
  ];
  app.innerHTML = `<article class="wrap" id="top"><div class="breadcrumb"><a href="./#archive">← 全部豆子</a><span>COFFEE ARCHIVE</span></div><section class="detail-hero"><div><span class="eyebrow">COFFEE ARCHIVE · ${escapeHtml(bean.recordType)}</span><h1 lang="en">${escapeHtml(bean.titleEn)}</h1><p class="detail-cn">${escapeHtml(bean.name)}</p><p class="detail-sub">${[bean.country,bean.process,bean.roast].filter(Boolean).map(escapeHtml).join(' / ')}</p><div class="flavors">${bean.flavors.map(flavor => `<span>${escapeHtml(flavor)}</span>`).join('')}</div><p class="flavor-attribution">${escapeHtml(bean.flavorSource)}</p></div>${cover(bean,true)}</section><div class="detail-content"><section aria-label="豆子资料"><h2 class="info-title">豆子资料</h2><dl class="facts">${facts.map(([title,value]) => `<div class="fact"><dt>${escapeHtml(title)}</dt><dd>${escapeHtml(value || '未提供')}</dd></div>`).join('')}</dl>${mapCredits(bean)}</section><section class="story"><div class="info-title">资料与风味</div><h2>${escapeHtml(bean.storyTitle || '关于这支豆子')}</h2><p class="story-intro">${escapeHtml(bean.story || '详细介绍尚未补充。')}</p>${researchSections(bean)}${readingSources(bean)}${bean.qualityNotes?.length ? `<details class="record-notes"><summary>这款资料的补充说明</summary><ul>${bean.qualityNotes.map(note => `<li>${escapeHtml(note)}</li>`).join('')}</ul></details>` : ''}${bean.sourceImage ? `<details class="source-details"><summary>查看原始豆袋／介绍资料 <span>＋</span></summary><figure><a href="#original-source" class="source-zoom"><img src="${escapeHtml(bean.sourceImage)}" alt="${escapeHtml(bean.name)}的原始资料" loading="lazy"></a><figcaption>由收藏者提供的原始图片 · 点击图片可放大查看</figcaption></figure>${bean.nameReferences?.length ? `<div class="name-references">英文名称参考：${bean.nameReferences.map(ref => `<a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener">${escapeHtml(ref.title)} ↗</a>`).join(' · ')}</div>` : ''}</details>` : ''}</section></div><div class="detail-actions"><a class="button dark" href="./#archive">看看其他豆子 <span>↗</span></a><button id="copy-link" class="text-link">复制本页链接 ↗</button></div></article>`;
  document.querySelector('.source-zoom')?.addEventListener('click', event => {event.preventDefault(); const figure=event.currentTarget.closest('figure'); figure.classList.toggle('source-expanded');});
  document.querySelector('#copy-link').addEventListener('click', async () => {
    try {
      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(location.href);
      toast('链接已复制');
    } catch { toast('请从浏览器地址栏复制本页链接'); }
  });
}
let toastTimer;
function toast(message) {
  const element = document.querySelector('#toast');
  element.textContent = message;element.classList.add('show');
  clearTimeout(toastTimer);toastTimer = setTimeout(() => element.classList.remove('show'),2800);
}

start();
</script>
</body>
</html>
