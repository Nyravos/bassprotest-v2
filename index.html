    }

    .serif {
      font-family: 'Noto Serif SC', serif;
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bg-deep {

    .progress-bar {
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);

              <section class="bg-slate-900/50 border border-white/5 rounded-3xl p-6">
                <h2 class="serif text-white font-bold text-xl mb-5">
                  3. 你的四条人格轴
                </h2>
                <div class="space-y-6">
                  ${report.axisResults.map((axis) => axisBar(axis)).join("")}
                </div>
              </section>

              <section class="bg-white/5 border border-white/10 rounded-3xl p-6">
                <h2 class="serif text-white font-bold text-xl mb-4">
                  4. 你的优势
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${primaryMeta.strengths.map(item => `
                    <div class="rounded-2xl bg-white/[0.03] border border-white/5 p-4 text-slate-300 text-xs leading-relaxed">
                      ${item}
                    </div>
                  `).join("")}
                </div>
              </section>

              <section class="bg-white/5 border border-white/10 rounded-3xl p-6">
                <h2 class="serif text-white font-bold text-xl mb-4">
                  5. 你的盲区
                </h2>
                <div class="space-y-3">
                  ${primaryMeta.blind.map(item => `
                    <p class="text-slate-400 text-sm leading-relaxed border-l border-blue-400/30 pl-4">
                      ${item}
                    </p>
                  `).join("")}
                </div>
              </section>

              <section class="bg-white/5 border border-white/10 rounded-3xl p-6">
                <h2 class="serif text-white font-bold text-xl mb-4">
                  6. 钓鱼对你而言
                </h2>
                <p class="text-slate-300 text-sm leading-relaxed">
                  ${primaryMeta.fishing}
                </p>
              </section>

              <section class="bg-blue-500/10 border border-blue-400/20 rounded-3xl p-8 text-center">
                <p class="text-[10px] text-blue-300 uppercase tracking-[0.35em] font-bold mb-4">
                  Your Creed
                </p>
                <p class="serif text-2xl text-white font-bold leading-relaxed mb-3">
                  ${primaryMeta.creedEn}
                </p>
                <p class="text-slate-400 text-sm leading-relaxed">
                  ${primaryMeta.creedCn}
                </p>
              </section>

              <section class="text-center pt-4 pb-8">
                <p class="serif text-xl text-slate-300 leading-relaxed mb-8">
                  钓鱼没有标准答案，正如人生没有唯一道路。<br>
                  你如何面对水域，也如何面对自己。
                </p>
                <button onclick="restartTest()" class="nav-btn px-10 py-3.5 rounded-full font-bold text-xs tracking-widest uppercase">
                  重新测试
                </button>
              </section>
            </div>
          </div>
        `;
        return;
      }
    }

    function axisBar(axis) {
      return `
        <div>
          <div class="flex justify-between items-center mb-2">
            <div>
              <p class="text-slate-200 text-sm font-bold">${axis.meta.question}</p>
              <p class="text-slate-500 text-[10px] mt-1">${axis.meta.left}（${axis.meta.leftCn}） ↔ ${axis.meta.right}（${axis.meta.rightCn}）</p>
            </div>
            <span class="text-blue-400 text-xs font-mono">${axis.dominantLabel}</span>
          </div>
          <div class="h-2 w-full bg-white/5 rounded-full overflow-hidden mb-2 relative">
            <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full" style="width: ${axis.rightPct}%"></div>
          </div>
          <div class="flex justify-between text-[10px] text-slate-500">
            <span>${axis.leftPct}% ${axis.meta.leftCn}</span>
            <span>${axis.rightPct}% ${axis.meta.rightCn}</span>
          </div>
        </div>
      `;
    }

    // =========================
    // 6. 交互
    // =========================
    function changeState(nextState) {
      currentState = nextState;
      render();
    }

    function startChapter(chapter) {
      activeChapter = chapter;
      currentQIndex = (chapter - 1) * 5;
      currentState = "chapter_start";
      render();
    }

    function handleAnswer(optionIndex) {
      const question = questions[currentQIndex];
      const option = question.options[optionIndex];

      if (option.axes) {
        Object.entries(option.axes).forEach(([axis, val]) => {
          scores.axes[axis] += val;
        });
      }

      const isEndOfChapter = currentQIndex % 5 === 4;

      if (isEndOfChapter) {
        currentState = "chapter_end";
      } else {
        currentQIndex++;
      }

      render();
    }

    function generateFinalReport() {
      currentState = "report";
      render();
    }

    function restartTest() {
      scores = {
        axes: {
          search: 0,
          choice: 0,
          gamble: 0,
          meaning: 0
        }
      };
      currentState = "cover";
      currentQIndex = 0;
      activeChapter = 1;
      render();
    }

    // =========================
    // 7. 结果计算
    // =========================
    function calculateAxisStats() {
      const stats = {
        search: { min: 0, max: 0, baseline: 0 },
        choice: { min: 0, max: 0, baseline: 0 },
        gamble: { min: 0, max: 0, baseline: 0 },
        meaning: { min: 0, max: 0, baseline: 0 }
      };

      questions.forEach(q => {
        Object.keys(stats).forEach(axis => {
          const vals = q.options.map(o => (o.axes && o.axes[axis]) ? o.axes[axis] : 0);
          const avg = vals.reduce((sum, val) => sum + val, 0) / vals.length;
          stats[axis].min += Math.min(...vals);
          stats[axis].max += Math.max(...vals);
          stats[axis].baseline += avg;
        });
      });

      return stats;
    }

    function axisPercent(axisName, rawValue, stats) {
      const s = stats[axisName];
      const centered = rawValue - s.baseline;
      const maxCentered = s.max - s.baseline;
      const minCentered = s.min - s.baseline;
      let rightPct = 50;

      if (centered >= 0) {
        rightPct = maxCentered === 0 ? 50 : 50 + (centered / maxCentered) * 50;
      } else {
        rightPct = minCentered === 0 ? 50 : 50 - (Math.abs(centered) / Math.abs(minCentered)) * 50;
      }

      rightPct = Math.max(0, Math.min(100, Math.round(rightPct)));
      return {
        rightPct,
        leftPct: 100 - rightPct,
        centered
      };
    }

    function calculateReport() {
      const stats = calculateAxisStats();
      const centeredScores = {
        search: scores.axes.search - stats.search.baseline,
        choice: scores.axes.choice - stats.choice.baseline,
        gamble: scores.axes.gamble - stats.gamble.baseline,
        meaning: scores.axes.meaning - stats.meaning.baseline
      };

      const searchSide = centeredScores.search < 0 ? "E" : "A";
      const choiceSide = centeredScores.choice < 0 ? "L" : "I";
      const gambleSide = centeredScores.gamble < 0 ? "C" : "A";
      const mindsetKey = centeredScores.meaning < 0 ? "T" : "Z";

      const personalityKey = `${searchSide}${choiceSide}${gambleSide}`;

      const axisResults = Object.keys(axisMeta).map(axis => {
        const pct = axisPercent(axis, scores.axes[axis], stats);
        const meta = axisMeta[axis];
        const dominantLabel = pct.centered < 0
          ? `${meta.left}（${meta.leftCn}）`
          : `${meta.right}（${meta.rightCn}）`;
        return {
          axis,
          rawValue: scores.axes[axis],
          value: Number(pct.centered.toFixed(2)),
          meta,
          leftPct: pct.leftPct,
          rightPct: pct.rightPct,
          dominantLabel
        };
      });

      return {
        personalityKey,
        mindsetKey,
        axisResults,
        rawScores: scores.axes,
        centeredScores
      };
    }

    render();
  </script>
</body>
</html>
